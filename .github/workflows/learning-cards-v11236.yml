name: Cards Educa+ V112.36
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/static/css/learning-cards-v11236.css'
      - 'public/html/index.html'
      - 'scripts/validar-learning-cards-v11236.mjs'
      - '.github/workflows/learning-cards-v11236.yml'
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          python3 -m http.server 8789 --directory public >/tmp/cards-server.log 2>&1 &
          node scripts/validar-learning-cards-v11236.mjs
