name: Experimento visual idosos V112.79
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparacao:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Comparar interface antiga e experimental
        run: |
          python3 -m http.server 8789 --directory public >/tmp/senior.log 2>&1 &
          sleep 2
          node tests/platform-web-senior-preview-v11279.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparacao-visual-v11279
          path: artifacts/senior-preview/
