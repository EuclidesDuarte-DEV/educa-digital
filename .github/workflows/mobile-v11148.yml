name: Layout responsivo e acessibilidade V111.50

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-smoke:
    name: Responsividade e fullscreen 320–1920px
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar navegador para teste visual
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar sete resolucoes sem banco remoto
        run: |
          python3 -m http.server 8789 --directory public >/tmp/educa-http.log 2>&1 &
          node scripts/validar-mobile-v11148.mjs
      - name: Validar 11 larguras, cabecalho, login e acessibilidade
        run: node scripts/validar-layout-v11149.mjs
      - name: Fullscreen iPhone Safari e desktop sem sobreposicoes
        run: node scripts/validar-fullscreen-v11150.mjs
      - name: Imagens para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educa-v11150-fullscreen-multidevice
          path: |
            artifacts/layout-v11148/
            artifacts/layout-v11149/
            artifacts/fullscreen-v11150/
          if-no-files-found: ignore
