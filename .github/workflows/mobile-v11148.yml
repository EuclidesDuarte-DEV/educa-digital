name: Layout responsivo, LIA e pre-teste V111.54

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-smoke:
    name: Interface completa 320–1920px e video Lia
    runs-on: ubuntu-24.04 # Playwright 1.56 não suporta Ubuntu 26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar navegador para teste visual
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: V111.54 — cabeçalho desktop, destaque Banco e video da LIA sem cortes
        run: |
          python3 -m http.server 8789 --directory public >/tmp/educa-http.log 2>&1 &
          node scripts/validar-interface-v11154.mjs
      - name: Testar sete resolucoes sem banco remoto
        run: node scripts/validar-mobile-v11148.mjs
      - name: Validar 11 larguras, cabecalho, login e acessibilidade
        run: node scripts/validar-layout-v11149.mjs
      - name: Fullscreen iPhone Safari e desktop sem sobreposicoes
        run: node scripts/validar-fullscreen-v11150.mjs
      - name: Entrada de telefone unica — conta nova e existente
        run: node scripts/validar-entrada-v11151.mjs
      - name: Modo Livre — WhatsApp, video, ligacao e SMS em 3 resolucoes
        run: node scripts/validar-modo-livre-v11153.mjs
      - name: Imagens para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educa-v11154-ui-auditoria
          path: |
            artifacts/layout-v11148/
            artifacts/layout-v11149/
            artifacts/fullscreen-v11150/
            artifacts/entrada-v11151/
            artifacts/modo-livre-v11153/
            artifacts/layout-v11154/
          if-no-files-found: ignore
