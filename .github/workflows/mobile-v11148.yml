name: V111.48 — layout mobile e acessibilidade

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-smoke:
    name: Layout real 320–768px no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar navegador para teste visual
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar sete resolucoes sem banco remoto
        run: |
          python3 -m http.server 8789 --directory public >/tmp/educa-http.log 2>&1 &
          node scripts/validar-mobile-v11148.mjs
      - name: Imagens para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educa-v11148-mobile
          path: artifacts/layout-v11148/
          if-no-files-found: ignore
