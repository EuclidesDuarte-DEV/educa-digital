name: V112.16 — Fotos Gmail Mensagens Web
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/static/js/web-apps-v11216.js'
      - 'public/static/css/web-apps-v11216.css'
      - 'public/static/js/web-real.js'
      - 'public/html/index.html'
      - 'scripts/validar-web-apps-v11216.mjs'
      - 'tests/web-apps-v11216.test.js'
      - 'public/static/css/web-gmail-light-v11217.css'
      - 'scripts/validar-web-gmail-v11217.mjs'
      - 'tests/web-gmail-light-v11217.test.js'
      - 'public/static/css/web-apps-light-notices-v11218.css'
      - 'scripts/validar-web-apps-light-notices-v11218.mjs'
      - 'tests/web-apps-light-notices-v11218.test.js'
      - 'public/static/css/web-light-youtube-maps-agenda-v11219.css'
      - 'public/static/js/web-more-apps-v11219.js'
      - 'scripts/validar-web-more-apps-v11219.mjs'
      - 'tests/web-more-apps-v11219.test.js'
      - 'scripts/diagnosticar-toques-web-v11220.mjs'
      - 'public/static/js/web-touch-recovery-v11220.js'
      - 'public/static/css/web-call-touch-light-v11220.css'
      - 'tests/web-touch-v11220.test.js'
      - 'public/static/css/web-compact-toolbars-v11221.css'
      - 'scripts/validar-web-toolbars-v11221.mjs'
      - 'tests/web-toolbars-v11221.test.js'
      - '.github/workflows/web-apps-v11216.yml'
permissions:
  contents: read
jobs:
  apps-web:
    name: Interação Fotos Gmail SMS e Câmera no navegador
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Testes de lógica e privacidade
        run: node --test tests/web-apps-v11216.test.js
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          test -d /ms-playwright
          ls /ms-playwright | head
      - name: Testar Foto, Gmail, SMS e Camera em 3 resoluções
        run: |
          python3 -m http.server 8789 --directory public > /tmp/educa-web-apps-v11216.log 2>&1 &
          node scripts/validar-web-apps-v11216.mjs
      - name: Gmail V112.17 claro e clicável com teclado iPhone
        run: |
          node --test tests/web-gmail-light-v11217.test.js
          node scripts/validar-web-gmail-v11217.mjs
      - name: Fotos, Gmail, SMS e Camera claros com notificacao tocavel V112.18
        run: |
          node --test tests/web-apps-light-notices-v11218.test.js
          node scripts/validar-web-apps-light-notices-v11218.mjs
      - name: WhatsApp claro, YouTube, Maps e Agenda V112.19 com toque e sistema dark
        run: |
          node --test tests/web-more-apps-v11219.test.js
          node scripts/validar-web-more-apps-v11219.mjs
      - name: V112.20 checagens de recuperação e escopo Web
        run: node --test tests/web-touch-v11220.test.js
      - name: V112.20 diagnostico de toques em chamadas Web
        run: node scripts/diagnosticar-toques-web-v11220.mjs
      - name: V112.20 iPhone Safari WebKit - toque real no fluxo WhatsApp LIA ligacao
        run: |
          EDUCA_BROWSER=webkit node scripts/diagnosticar-toques-web-v11220.mjs
      - name: V112.21 pesquisa filtros topo e rolagem independente nos seis apps
        run: |
          node --test tests/web-toolbars-v11221.test.js
          node scripts/validar-web-toolbars-v11221.mjs
      - name: Imagens da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-apps-v11216-screens
          path: |
            artifacts/web-apps-v11216/
            artifacts/web-gmail-v11217/
            artifacts/web-apps-light-v11218/
            artifacts/web-more-apps-v11219/
            artifacts/web-toolbars-v11221/
          if-no-files-found: ignore
