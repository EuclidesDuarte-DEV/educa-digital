name: Acessibilidade WCAG 2.2 AA — público idoso
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditoria:
    name: WCAG e legibilidade (Chromium e WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de auditoria
        run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.11.1
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit
      - name: Servir interface local isolada
        run: |
          python3 -m http.server 8789 --directory public >/tmp/educa-wcag.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8789/html/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Auditar WCAG e experiência do público idoso
        run: node scripts/validar-acessibilidade-wcag22.mjs
      - name: Guardar relatório e evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educa-wcag22-acessibilidade
          path: artifacts/accessibility/
          if-no-files-found: warn
          retention-days: 14
