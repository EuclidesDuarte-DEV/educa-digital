name: Validar Educa+ (Preview isolado)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  testes:
    name: Testes locais Node.js e schema Preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test --test-force-exit --test-concurrency=4 tests/*.test.js

  smoke-preview:
    name: API publica do Preview (nunca producao)
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Construir endereço DNS válido do Preview
        run: |
          slug=$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g;s/--*/-/g;s/^-//;s/-$//')
          echo "PREVIEW_URL=https://${slug}-educa-digital.educamaisdigital.workers.dev" >> "$GITHUB_ENV"
      - name: Aguardar o build Cloudflare do commit correto
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in $(seq 1 30); do
            if ! dados=$(curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs"); then
              echo "Consulta GitHub indisponível (tentativa $tentativa/30); repetindo sem aprovar o build."
              sleep 10
              continue
            fi
            if ! status=$(printf '%s' "$dados" | node -e '
              let s = ""; process.stdin.on("data", c => s += c);
              process.stdin.on("end", () => {
                const checks = JSON.parse(s).check_runs || [];
                const build = checks.find(c => c.name === "Workers Builds: educa-digital");
                process.stdout.write(build ? build.status + "/" + build.conclusion : "aguardando");
              });'); then
              echo "Resposta inválida do GitHub; repetindo consulta."
              sleep 10
              continue
            fi
            echo "Cloudflare $HEAD_SHA: $status"
            if [ "$status" = "completed/success" ]; then exit 0; fi
            if [ "$status" = "completed/failure" ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Confirmar /api/saude no Preview
        run: |
          for tentativa in $(seq 1 6); do
            status=$(curl --silent --show-error --max-time 12 -o /tmp/resposta-saude -w '%{http_code}' "$PREVIEW_URL/api/saude" || true)
            echo "Preview GET /api/saude: HTTP $status (tentativa $tentativa)"
            if [ "$status" = "200" ]; then
              head -c 400 /tmp/resposta-saude || true
              exit 0
            fi
            head -c 300 /tmp/resposta-saude || true
            echo ""
            sleep 8
          done
          exit 1
      - name: Validar conversa real com Gemma 4 no Preview
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.PREVIEW_URL+'/api/modo-livre/conversar';
          const body={scenario:'video',message:'Quem está falando e por que pediu o empréstimo?',history:[
            {role:'assistant',content:'Oi, troquei de celular. Você pode me emprestar R$ 350 pelo Pix de treino?'}
          ]};
          const started=Date.now();
          const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
          const data=await res.json();
          if(res.status!==200||data.ok!==true||data.mode!=='ia'||typeof data.reply!=='string'||data.reply.length<12){
            throw new Error('Workers AI Preview falhou: status='+res.status+' resposta='+JSON.stringify(data).slice(0,400));
          }
          if(/https?:\/\/|www\.|\b\d{7,}\b/.test(data.reply))throw new Error('Workers AI respondeu com links ou números não permitidos');
          console.log('Gemma real OK, latencia='+((Date.now()-started)/1000).toFixed(1)+'s; resposta: '+data.reply.slice(0,240));
          NODE
      - name: Cadastro demonstrativo e banco de Preview
        run: |
          node --input-type=module <<'NODE'
          const root = process.env.PREVIEW_URL;
          const response = await fetch(root + '/api/conta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: '6500000000' })
          });
          const data = await response.json();
          if (![201, 409].includes(response.status) || (response.status === 201 && data.ok !== true) || (response.status === 409 && data.needs_login !== true)) {
            throw new Error('Cadastro do Preview falhou: HTTP ' + response.status + ': ' + JSON.stringify(data));
          }
          console.log('Cadastro no banco isolado: OK (' + response.status + ')');
          const second = await fetch(root + '/api/conta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: '6500000000' })
          });
          const again = await second.json();
          if (second.status !== 409 || again.needs_login !== true) {
            throw new Error('Conta existente nao protegida: HTTP ' + second.status);
          }
          console.log('Retorno de conta existente: OK');
          NODE
      - name: V112.63 — validar XP real no D1 isolado e retomada de conta
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          const root=process.env.PREVIEW_URL;
          assert.match(new URL(root).hostname,/^[a-z0-9-]+-educa-digital\.educamaisdigital\.workers\.dev$/);
          async function call(path,body,token){
            const res=await fetch(root+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(20000)});
            return {status:res.status,data:await res.json()};
          }
          async function login(phone){
            const created=await call('/api/conta',{phone});
            if(created.status===201){assert.match(created.data.level_token||'',/^[a-f0-9]{64}$/);return created.data.level_token;}
            assert.equal(created.status,409);
            const code=await call('/api/login/codigo',{phone});
            assert.equal(code.status,200);
            const result=await call('/api/login/confirmar',{phone,code:code.data.demo_code});
            assert.equal(result.status,200);assert.match(result.data.level_token||'',/^[a-f0-9]{64}$/);
            return result.data.level_token;
          }
          const path='/api/modo-livre/nivel';
          const a=await login('6500000000'),b=await login('6500000001');
          assert.notEqual(a,b);
          const denied=await call(path);assert.equal(denied.status,401);
          async function xp(token,body){
            const r=await call(path,body,token);assert.equal(r.status,200);assert.equal(r.data.ok,true);assert.ok(Number.isInteger(r.data.xp));return r.data.xp;
          }
          const before=await xp(a),other=await xp(b);
          const event={eventId:randomUUID(),outcome:before>9979?'risk':'safe'};
          const expected=before+(event.outcome==='safe'?20:-15);
          assert.equal(await xp(a,event),expected);
          assert.equal(await xp(a,event),expected,'reenvio duplicou XP');
          assert.equal(await xp(b),other,'XP vazou para outra conta');
          const newDevice=await login('6500000000');
          assert.equal(await xp(newDevice),expected,'XP não recuperado após novo login');
          console.log('XP real no Preview: sessão, persistência, idempotência e isolamento OK');
          NODE

  neural-voice-preview:
    name: Kokoro pf_dora real no navegador Preview
    needs: smoke-preview
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    env:
      PREVIEW_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Instalar navegador para síntese ONNX
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          test -d /ms-playwright
          ls /ms-playwright
      - name: Endereço isolado de Preview
        run: |
          slug=$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g;s/--*/-/g;s/^-//;s/-$//')
          echo "PREVIEW_URL=https://${slug}-educa-digital.educamaisdigital.workers.dev" >> "$GITHUB_ENV"
      - name: Provar áudio ONNX real da Dora, sem Roberta nem API paga
        run: node scripts/validar-dora-neural-real-v11207.mjs
      - name: Sintetizar WAV real Kokoro pf_dora
        run: node scripts/validar-kokoro-real-v11157.mjs
