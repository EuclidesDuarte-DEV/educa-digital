name: Home responsiva V112.38
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/static/css/home-responsive-v11238.css'
      - 'public/static/js/home-responsive-v11238.js'
      - 'public/html/index.html'
      - 'scripts/validar-home-responsive-v11238.mjs'
      - '.github/workflows/home-responsive-v11238.yml'
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          python3 -m http.server 8789 --directory public >/tmp/home-server.log 2>&1 &
          node scripts/validar-home-responsive-v11238.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-v11241-capturas
          path: artifacts/home-v11241/
          if-no-files-found: ignore
