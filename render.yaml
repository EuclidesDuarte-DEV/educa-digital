services:
  - type: web
    name: educa-digital
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EDUCA_SECRET_KEY
        generateValue: true
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FALLBACK
        value: openai/gpt-oss-20b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
