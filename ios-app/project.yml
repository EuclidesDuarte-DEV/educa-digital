name: EducaDigitalIOS
options:
  bundleIdPrefix: com.educamaisdigital
  deploymentTarget:
    iOS: "16.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    CODE_SIGN_STYLE: "Automatic"
    ENABLE_BITCODE: "NO"

targets:
  EducaDigital:
    type: application
    platform: iOS
    sources:
      - path: EducaDigital
      - path: Shared/SpamNumberStore.swift
    dependencies:
      - target: CallerIDExtension
        embed: true
        link: false
    entitlements:
      path: EducaDigital/EducaDigital.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.educamaisdigital.educa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.educamaisdigital.educa
        PRODUCT_NAME: EducaDigital
        INFOPLIST_KEY_CFBundleDisplayName: "Educa+ Digital"
    info:
      path: EducaDigital/Info.plist
      properties:
        CFBundleDisplayName: "Educa+ Digital"
        CFBundleShortVersionString: "111.71"
        CFBundleVersion: "11171"
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "A LIA utiliza o microfone somente quando você permite, durante os exercícios simulados de chamadas."
        NSCameraUsageDescription: "A câmera pode ser usada somente com sua autorização, durante exercícios simulados de videochamada."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}

  CallerIDExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallerIDExtension/CallDirectoryProvider.swift
      - path: Shared/SpamNumberStore.swift
    entitlements:
      path: CallerIDExtension/CallerIDExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.educamaisdigital.educa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.educamaisdigital.educa.callerid
        PRODUCT_NAME: EducaCallerID
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
    info:
      path: CallerIDExtension/Info.plist
      properties:
        CFBundleDisplayName: "Educa+ Proteção de Chamadas"
        CFBundleShortVersionString: "111.71"
        CFBundleVersion: "11171"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.callkit.call-directory"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).CallDirectoryProvider"
